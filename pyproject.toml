[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "browser-trail"
version = "1.0.0"
description = "Merged local browser timeline: history, downloads with target paths, bookmarks, profile stats"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pajt9whauht283as" }]
keywords = ["forensics", "browser", "history", "timeline", "incident-response", "sqlite"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]

[project.scripts]
browser-trail = "trail.cli:main"

[project.urls]
Homepage = "https://github.com/Pajt9whauht283as/browser-trail"

[tool.setuptools.packages.find]
include = ["trail*"]
